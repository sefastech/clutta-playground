name: Workload validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workload-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set the isolated evidence directory
        run: echo "CLUTTA_PLAYGROUND_DATA_ROOT=$HOME/sanitized-cases/clutta-playground" >> "$GITHUB_ENV"
      - name: Install pinned helper dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build from the clean checkout without warm dependency layers
        run: docker build --pull --no-cache --build-arg "SOURCE_REVISION=$GITHUB_SHA" --tag "clutta-playground-scheduler:$GITHUB_SHA" scenarios/scheduler
      - name: Focused contracts and syntax
        run: |
          node --check workload
          node --check lab
          node --check lib/cloud.mjs
          node --check lib/release.mjs
          node --test test/*.test.mjs
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL "clutta-playground-scheduler:$GITHUB_SHA" npm test
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL "clutta-playground-scheduler:$GITHUB_SHA" npm run check
      - name: Dependency audit
        run: |
          npm audit --omit=dev
          docker run --rm --read-only --tmpfs /tmp "clutta-playground-scheduler:$GITHUB_SHA" npm audit --omit=dev
      - name: Secret scan
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --no-git --redact
      - name: Real PostgreSQL healthy, silent-pause, and repair proof
        run: |
          ./workload start
          ./workload verify
      - name: Stop only this job's workload, preserving evidence
        if: always()
        run: |
          if test -f "$CLUTTA_PLAYGROUND_DATA_ROOT/active-workload.json"; then
            ./workload stop
          fi
      - name: Preserve fake-data logs and verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workload-proof-${{ github.run_id }}
          path: |
            ${{ env.CLUTTA_PLAYGROUND_DATA_ROOT }}/clutta-playground-*/logs/*.log
            ${{ env.CLUTTA_PLAYGROUND_DATA_ROOT }}/clutta-playground-*/receipts/*.json
          if-no-files-found: warn
          retention-days: 7
